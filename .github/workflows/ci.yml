name: CI

# Pull requests run the Checks workflow alone; a push to master runs it here, then releases
# with semantic-release when the push changes the plugin.
on:
  push:
    branches: [master]

jobs:
  test:
    name: Check & test
    uses: ./.github/workflows/checks.yml

  changes:
    name: Plugin changes
    runs-on: ubuntu-24.04
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4
      # Only what the published plugin is built from: its sources, its build and publish scripts, the
      # README both packages ship, and worker-api, whose API definition and schemas it bundles. Tests
      # and their config change nothing that ships. The lockfile and the root manifest change its
      # dependencies.
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            plugin:
              - 'apps/plugin/src/**'
              - 'apps/plugin/build/**'
              - 'apps/plugin/scripts/**'
              - 'apps/plugin/package.json'
              - 'apps/plugin/README.md'
              - 'apps/plugin/vite.config.ts'
              - 'apps/plugin/tsconfig.json'
              - 'packages/worker-api/src/**'
              - 'packages/worker-api/package.json'
              - 'packages/worker-api/tsconfig.json'
              - 'pnpm-lock.yaml'
              - 'package.json'

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: [test, changes]
    if: needs.changes.outputs.plugin == 'true'
    # id-token lets npm trade GitHub's OIDC token for a publish token when the
    # package has a trusted publisher, and signs the provenance attestation.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      # Node 24.18 bundles npm 11.16, past the 11.5.1 that trusted publishing needs.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # semantic-release rebuilds at the new version in its prepare step, but
      # the npm plugin reads the pi package's manifest before that, so it must
      # exist already.
      - run: pnpm --filter @tentacles/plugin build
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
