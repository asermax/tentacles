packages:
  - "apps/*"
  - "packages/*"

# Fail an install whose peer pins do not match, so two copies of a package
# (such as a second pi-env through ws) cannot slip in.
strictPeerDependencies: true

# capnp-es (through miniflare) declares TypeScript 5 or 6 as a peer; it runs
# with the repo's TypeScript 7.
peerDependencyRules:
  allowedVersions:
    capnp-es>typescript: "7"

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  esbuild: true
  lefthook: false
  protobufjs: false
  workerd: true

# Exact pins newer than pnpm's minimum release age. One entry per version; a
# bump replaces its entry.
minimumReleaseAgeExclude:
  - "@effect/vitest@4.1.3"
  - "effect@4.1.3"
  - "@earendil-works/chord@1.5.1"
  - "@earendil-works/pi-ai@1.5.1"
  - "@earendil-works/pi-codemode@1.5.1"
  - "@earendil-works/pi-durable@1.5.1"
  - "@earendil-works/pi-env@1.5.1"
  - "@earendil-works/pi-schema@1.5.1"
  - "@earendil-works/pi-telemetry@1.5.1"
  - "@effect/platform-node-shared@4.1.3"
  - "@effect/platform-node@4.1.3"
