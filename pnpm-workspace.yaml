packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: false
  workerd: true

# Exact pins newer than pnpm's minimum release age. One entry per version; a
# bump replaces its entry.
minimumReleaseAgeExclude:
  - "@effect/vitest@4.1.3"
  - "effect@4.1.3"
